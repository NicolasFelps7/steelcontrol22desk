name: Gerar instalador SteelControl Desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar instalador com Edge integrado
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ./desktop/GERAR_INSTALADOR.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SteelControl-Instalador-Windows
          path: desktop/release/SteelControl-Instalador-*.exe
          if-no-files-found: error
